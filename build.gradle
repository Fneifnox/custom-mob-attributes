plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'net.fneifnox'
version = '1.0.0-paper'

ext {
    config_version = 1
    lang_version = 1
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.3-R0.1-SNAPSHOT")
    implementation("net.kyori:adventure-api:5.2.0")
    implementation("net.kyori:adventure-text-minimessage:5.2.0")
    implementation("org.bstats:bstats-bukkit:3.2.1")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        downloadPlugins {
            // modrinth("ViaVersion", "5.11.0-SNAPSHOT+1036")
        }

        minecraftVersion("1.21.3")
        serverJar(file("run/paper-1.21.3-83.jar"))
    }
}

tasks.shadowJar {
    relocate 'org.bstats', 'net.fneifnox.bstats'

    archiveBaseName = 'custom-mob-attributes-1.21.3'
    archiveClassifier = ''

    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        include(dependency('org.bstats:bstats-bukkit:3.2.1'))
        include(dependency('org.bstats:bstats-base:3.2.1'))
    }

    mergeServiceFiles()
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
